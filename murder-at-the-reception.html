<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Murder at the Reception</title>
<!-- Murder mystery template. Open this page with #admin at the end of the address and enter the admin passcode to customize. -->
<style>body{--fh:"Courier New",Courier,monospace;--fb:Georgia,"Times New Roman",serif;--pin:#c2415a;--onpin:#fff;--onsel:#fff;--bg:#f6f7fb;--card:#fff;--ink:#14213d;--mute:#5b6477;--line:#c9cfdd;--gold:#b8860b;--rose:#c2415a;--room:#e8ecf5;min-height:100vh;background:var(--bg);color:var(--ink);font:17px/1.55 var(--fb)}
@media (prefers-color-scheme:dark){body{--bg:#0e1630;--card:#16213f;--ink:#eef1f8;--mute:#a3adc4;--line:#34426a;--gold:#e0b84c;--rose:#f08a9d;--room:#1c2850}}
h1,h2,h3{font-family:var(--fh);line-height:1.2;margin:0 0 .5em;font-weight:700}
h1{font-size:1.9rem}h2{font-size:1.3rem}h3{font-size:1.05rem}
p{margin:0 0 .9em}
a{color:inherit}
.stamp{display:inline-block;border:2px solid var(--rose);color:var(--rose);padding:2px 10px;font:700 .8rem var(--fh);transform:rotate(-3deg);margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin:0 0 16px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
nav a,.btn{border:1px solid var(--ink);padding:8px 14px;text-decoration:none;font:600 .9rem var(--fh);background:transparent;color:var(--ink);cursor:pointer;border-radius:4px;min-height:40px;display:inline-flex;align-items:center}
nav a.on,.btn.fill{background:var(--ink);color:var(--bg)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.map{width:100%;height:auto;display:block;background:var(--room);border:1px solid var(--line);border-radius:6px}
.list{list-style:none;padding:0;margin:0}
.list li{padding:8px 0;border-bottom:1px dashed var(--line)}
.list li:last-child{border:0}
.tag{font:700 .8rem var(--fh);color:var(--mute)}
.sus{display:grid;gap:10px}.sus .card{margin:0}
.result{margin-top:12px;padding:14px;border-left:5px solid var(--gold);background:var(--room)}
.hint summary{cursor:pointer;font:600 .95rem var(--fh);padding:6px 0}
.note{color:var(--mute);font-size:.9rem}
select,.inp{font:inherit;width:100%;padding:8px;margin:4px 0 14px;background:var(--card);color:var(--ink);border:1px solid var(--ink);border-radius:4px}
body{margin:0}main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.mapwrap{position:relative;line-height:0}
.pin{position:absolute;transform:translate(-50%,-50%);width:6.5%;max-width:48px;min-width:30px;aspect-ratio:1;border-radius:50%;background:var(--pin);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font:700 clamp(12px,2vw,20px)/1 var(--fh);color:var(--onpin);text-decoration:none;box-sizing:border-box}
.pin:focus-visible{outline:3px solid var(--gold)}
.pin.sel{background:var(--gold);color:var(--onsel);transform:translate(-50%,-50%) scale(1.25)}.mapwrap.edit{cursor:crosshair}
.cipher{font:700 1.1rem/1.6 var(--fh);word-break:break-word}
.bigstamp{font:700 3rem var(--fh);color:var(--rose)}
.fl{display:block;font-weight:600}.fl .inp,.fl select{font-weight:400}textarea.inp{resize:vertical;box-sizing:border-box}.inp,select{box-sizing:border-box}
.row{display:flex;gap:8px;align-items:flex-start}.row .inp{margin:0 0 8px}
.sub{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:0 0 10px}.sub summary{cursor:pointer;font:700 1rem var(--fh)}
.hl{border:2px solid var(--gold)}.steps{padding-left:20px}
.signgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:16px}
.sign{border:2px dashed #14213d;padding:14px;text-align:center;background:#fff;color:#14213d;break-inside:avoid;border-radius:6px}
.sign h3{margin:6px 0}.sign .qr svg{width:170px;height:170px}.sign small{display:block;font:.8rem var(--fh)}
@media print{body{background:#fff}.noprint,.result,nav{display:none!important}main{max-width:none}}
</style>

function clue(s,token){
  var n=C.stations.indexOf(s)+1, admin=isAdmin();
  if(!admin && !player()){
    app.innerHTML=head()+SignIn();
    $("pgo").onclick=function(){
      var nm=$("pn").value.trim();
      if(!nm) return $("perr").innerHTML='<div class="result">Enter your name first.</div>';
      if(!$("pa").checked) return $("perr").innerHTML='<div class="result">You must accept the difficulty to continue.</div>';
      LS.set(P+"player",JSON.stringify({name:nm,agreed:true})); clue(s,token);
    };
    return;
  }
  if(admin){ app.innerHTML=head()+ClueBody(s,n); return; }
  var T=C.timers, full=!s.ct, scanned = full ? token===s.key : !!(token&&SEAL.dec(SALT,token,s.ct));
  if(scanned){ LS.set(P+"ver-"+s.id, full?"1":token); curHash="#"+s.id; try{history.replaceState(null,"",location.pathname+location.search+"#"+s.id)}catch(e){} }
  var vv=LS.get(P+"ver-"+s.id), sd=full?null:(vv&&SEAL.dec(SALT,vv,s.ct)), ok = full ? vv==="1" : !!sd;
  if(sd) s=Object.assign({},s,sd);
  var opened = +(LS.get(P+"open-"+s.id)||0);
  var total=(T.clueSeconds + T.clueLockMinutes*60)*1000;
  if(ok && (!opened || (scanned && Date.now()>=opened+total))){ opened=Date.now(); LS.set(P+"open-"+s.id,String(opened)); }
  if(!ok){
    app.innerHTML=head()+'<span class="stamp">LOCKED</span><h1>Scan to open</h1>'+nav("")+'<div class="card"><p>This clue can only be opened by scanning the QR code at <b>'+esc(s.name)+'</b> ('+esc(s.where)+').</p></div><a class="btn fill" href="#map">Back to the map</a>';
    return;
  }
  function tick(){
    var now=Date.now(), left=opened+T.clueSeconds*1000-now;
    if(left>0){
      if(!$("cl")) app.innerHTML=head()+'<div class="result" style="margin-top:0;text-align:center"><b id="cl"></b></div>'+ClueBody(s,n);
      $("cl").textContent="Clue locks in "+fmt(left); return;
    }
    var wait=opened+total-now;
    app.innerHTML=head()+'<span class="stamp">SEALED</span><h1>Time\'s up</h1>'+nav("")+'<div class="card">'+(wait>0
      ? '<p>Your '+fmtDur(T.clueSeconds)+' with this clue are over. It is locked for <b>'+fmt(wait)+'</b>. After that, rescan the QR code at <b>'+esc(s.name)+'</b> to open it again.</p>'
      : '<p>The lock is over. Rescan the QR code at <b>'+esc(s.name)+'</b> ('+esc(s.where)+') to open this clue again.</p>')+'</div><a class="btn fill" href="#map">Back to the map</a>';
    if(wait<=0){clearInterval(timer);timer=null}
  }
  tick(); timer=setInterval(tick,1000);
}

function accuse(){
  var admin=isAdmin(), T=C.timers, need=Math.min(T.ruledOutRequired, C.suspects.length);
  var ro=cleared().filter(function(n){return C.suspects.some(function(s){return s.name===n})}).length;
  var h='<span class="stamp">ACCUSATION</span><h1>Name the killer</h1>'+nav("accuse")+'<div class="card">';
  if(!admin && ro<need){
    app.innerHTML=head()+h+'<p><b>Not so fast, detective.</b> Before you can accuse anyone, you must rule out '+need+' of the '+C.suspects.length+' suspects in your case file.</p><p class="note">Ruled out so far: '+ro+' of '+need+'. Open the case file and tick "Ruled out" on each suspect you have cleared.</p><a class="btn fill" href="#case">Go to the case file</a></div>';
    return;
  }
  if(!unlockedCode){
    app.innerHTML=head()+h+'<p>Enter the '+C.stations.length+'-letter passcode from your clue stamps, in station order.</p><input id="pc" class="inp" maxlength="'+C.stations.length+'" autocapitalize="characters" autocomplete="off" aria-label="Passcode" style="font:700 1.3rem \'Courier New\',monospace;text-transform:uppercase;margin:0 0 10px"><button class="btn fill" id="pu">Unlock</button><div aria-live="polite" id="pb"></div></div>';
    $("pu").onclick=function(){ if(codeOk($("pc").value)){unlockedCode=norm($("pc").value);accuse()} else $("pb").innerHTML='<div class="result">That code is not right. Check that you have every station and the letters are in order.</div>' };
    return;
  }
  var opt=function(a){return a.map(function(x){return '<option>'+esc(x)+'</option>'}).join("")};
  app.innerHTML=head()+h+'<label for="gn"><b>Your name</b></label><input id="gn" class="inp" maxlength="40" autocomplete="name">'+
   '<label for="w1"><b>Who did it?</b></label><select id="w1">'+opt(C.suspects.map(function(s){return s.name}))+'</select>'+
   '<label for="w2"><b>When did it happen?</b></label><select id="w2">'+opt(C.times)+'</select>'+
   '<label for="w3"><b>What was used?</b></label><select id="w3">'+opt(C.weapons)+'</select><div id="act"></div><div aria-live="polite" id="ar"></div></div>';
  function paint(){
    var until=+(LS.get(P+"lock-until")||0), now=Date.now();
    if(!admin && until>now){ $("act").innerHTML='<div class="result"><b>Wrong accusation.</b> You can try again in '+fmt(until-now)+'.</div>'; if(!timer) timer=setInterval(paint,1000); }
    else { if(timer){clearInterval(timer);timer=null} if(!$("go")){ $("act").innerHTML='<button class="btn fill" id="go">Make accusation</button>'; $("go").onclick=submit; } }
  }
  function submit(){
    var nm=$("gn").value.trim(), who=$("w1").value, when=$("w2").value, what=$("w3").value, S=C.full?C.solution:SEAL.dec(SALT,unlockedCode+"|"+who+"|"+when+"|"+what,C.sealed.sol);
    if(!nm) return $("ar").innerHTML='<div class="result">Enter your name first.</div>';
    if(C.full?(who===S.killer && when===S.time && what===S.weapon):!!S){
      var at=new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
      $("ar").innerHTML='<div class="result"><b>Case closed. It was '+esc(S.killer)+', at '+esc(S.time)+', with the '+esc(S.weapon.toLowerCase())+'.</b><p style="margin-top:8px">'+esc(S.explanation)+'</p><div class="card" style="border:2px dashed var(--gold);margin-top:12px"><b>Winner card</b><p style="margin:6px 0">Guest: '+esc(nm)+'<br>Suspect: '+esc(S.killer)+'<br>Time: '+esc(S.time)+'<br>Weapon: '+esc(S.weapon)+'<br>Solved at: '+at+'</p><p class="note" style="margin:0">'+esc(C.prizeNote)+'</p></div></div>';
    } else {
      $("ar").innerHTML = admin ? '<div class="result"><b>Not quite.</b> At least one answer is wrong. Recheck your clues and try again.</div>' : '';
      if(!admin) LS.set(P+"lock-until",String(Date.now()+T.accuseLockMinutes*60000));
      paint();
    }
  }
  paint();
}

  if(timer){clearInterval(timer);timer=null}
  var parts=getHash().replace("#","").split("~"), h=parts[0], tok=parts[1]||"";
  var s=C.stations.filter(function(x){return x.id===h})[0];
  document.title=C.title;applyTheme(C.theme);
  if(s) return clue(s,tok);
  if(h==="case"){app.innerHTML=head()+CaseView();return bindCase()}
  if(h==="accuse") return accuse();
  if(h==="admin") return adminView();
  if(h==="edit") return editor();
  if(h==="signs") return signs();
  app.innerHTML=head()+MapView();
}
function go(h){curHash=h;try{history.pushState(null,"",h)}catch(e){}D=null;route();try{scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",function(){curHash=null;D=null;route();scrollTo(0,0)});
window.addEventListener("popstate",function(){curHash=null;D=null;route()});
document.addEventListener("click",function(e){var a=e.target;while(a&&a!==document&&a.tagName!=="A")a=a.parentNode;if(!a||a===document)return;var h=a.getAttribute("href");if(!h||h.charAt(0)!=="#")return;e.preventDefault();go(h)});
route();
})();
</script>
